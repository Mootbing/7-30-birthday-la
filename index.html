<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbfaf6">
  <title>LA Birthday Journey — Loading</title>
  <style>
    html,body{height:100%;margin:0;background:#fbfaf6;color:#202722;font:16px Georgia,serif}
    body{display:grid;place-items:center}
    main{text-align:center}
    .s{width:34px;height:34px;border:2px solid #d8d8cf;border-top-color:#9f3d32;border-radius:50%;margin:0 auto 14px;animation:r .8s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main><div class="s"></div><strong>Unrolling the day’s journey…</strong></main>
  <script>
    (async () => {
      const names = ['p0.txt','p1.txt','p2.txt','p3.txt','p4.txt','p5.txt','p6.txt','p7.txt'];
      const b64 = (await Promise.all(names.map(name => fetch(name).then(response => {
        if (!response.ok) throw Error(name);
        return response.text();
      })))).join('');
      const bytes = Uint8Array.from(atob(b64), character => character.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html = await new Response(stream).text();

      const redesign = `
        <meta property="og:title" content="LA Birthday Journey — July 30, 2026">
        <meta property="og:description" content="One long day, drawn in ink — a birthday journey from the Pacific to the city lights.">
        <meta property="og:type" content="website">
        <meta property="og:image" content="https://mootbing.github.io/7-30-birthday-la/ink-wash-la.png">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="LA Birthday Journey — July 30, 2026">
        <meta name="twitter:description" content="One long day, drawn in ink.">
        <meta name="twitter:image" content="https://mootbing.github.io/7-30-birthday-la/ink-wash-la.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
          :root {
            --ink: #1f2822;
            --ink-soft: #626a63;
            --paper: #fbfaf6;
            --paper-strong: #fffefa;
            --line: rgba(31, 40, 34, .13);
            --line-strong: rgba(31, 40, 34, .25);
            --navy: #27342d;
            --navy-2: #3d5146;
            --teal: #52776c;
            --teal-soft: #edf3ee;
            --rose: #9f3d32;
            --rose-soft: #f7ebe7;
            --amber: #a46a2a;
            --amber-soft: #f8f0df;
            --green: #4f715d;
            --green-soft: #ecf3ed;
            --shadow: 0 22px 65px rgba(49, 54, 45, .07);
            --radius-lg: 8px;
            --radius-md: 5px;
            --radius-sm: 3px;
            --shell: 1320px;
          }

          * { box-sizing: border-box; }
          html { scroll-behavior: smooth; scroll-padding-top: 30px; }
          body {
            color: var(--ink);
            background:
              radial-gradient(ellipse at 3% 36%, rgba(105, 135, 118, .07), transparent 31rem),
              radial-gradient(ellipse at 96% 68%, rgba(159, 61, 50, .045), transparent 27rem),
              repeating-linear-gradient(91deg, rgba(49, 54, 45, .012) 0, rgba(49, 54, 45, .012) 1px, transparent 1px, transparent 7px),
              var(--paper);
            font-family: "DM Sans", sans-serif;
            font-weight: 400;
            line-height: 1.6;
          }
          body::before, body::after {
            content: "";
            position: fixed;
            z-index: -1;
            pointer-events: none;
            border-radius: 48% 52% 58% 42%;
            filter: blur(10px);
          }
          body::before { width: 30rem; height: 18rem; top: 34%; left: -16rem; background: rgba(89, 120, 105, .045); transform: rotate(-12deg); }
          body::after { width: 22rem; height: 29rem; right: -13rem; bottom: 6%; background: rgba(169, 91, 71, .035); transform: rotate(17deg); }

          ::selection { color: #fff; background: var(--rose); }
          h1, h2, h3 { text-wrap: balance; }
          p { text-wrap: pretty; }
          :focus-visible { outline: 2px solid var(--rose); outline-offset: 4px; }

          .scroll-progress {
            position: fixed;
            inset: 0 auto auto 0;
            z-index: 10001;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #7d9d8c, #9f3d32);
            box-shadow: 0 0 12px rgba(159, 61, 50, .25);
          }

          .ink-nav {
            position: absolute;
            z-index: 50;
            top: 24px;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transform: translateX(-50%);
          }
          .ink-brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
          .ink-brand__seal {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border: 2px solid var(--rose);
            color: var(--rose);
            font-family: "Ma Shan Zheng", cursive;
            font-size: 1.45rem;
            line-height: 1;
            transform: rotate(-2deg);
            box-shadow: inset 0 0 0 2px rgba(159, 61, 50, .1);
          }
          .ink-brand b, .ink-brand small { display: block; }
          .ink-brand b { font-family: "Cormorant Garamond", serif; font-size: 1.15rem; font-weight: 600; letter-spacing: .04em; }
          .ink-brand small { margin-top: -2px; color: var(--ink-soft); font-size: .6rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
          .ink-nav__links { display: flex; align-items: center; gap: 30px; }
          .ink-nav__links a { position: relative; color: var(--ink); font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
          .ink-nav__links a::after { content: ""; position: absolute; right: 0; bottom: -7px; left: 0; height: 1px; background: var(--rose); transform: scaleX(0); transform-origin: left; transition: transform .25s ease; }
          .ink-nav__links a:hover::after { transform: scaleX(1); }

          .shell { width: min(calc(100% - 64px), var(--shell)); }
          .hero {
            min-height: min(900px, 94svh);
            color: var(--ink);
            background:
              linear-gradient(90deg, rgba(251,250,246,.98) 0%, rgba(251,250,246,.9) 29%, rgba(251,250,246,.38) 52%, rgba(251,250,246,.03) 78%),
              linear-gradient(0deg, var(--paper) 0%, transparent 18%),
              url("ink-wash-la.png") center bottom / cover no-repeat,
              var(--paper);
            border-radius: 0;
          }
          .hero::after { content: ""; position: absolute; right: 4%; bottom: 7%; width: 7rem; height: 1px; background: linear-gradient(90deg, transparent, rgba(31,40,34,.3)); }
          .hero__inner { display: flex; flex-direction: column; justify-content: center; min-height: min(900px, 94svh); padding: 130px 0 100px; }
          .hero__glow { opacity: .2; filter: blur(24px); }
          .hero__glow--one { right: 14%; top: 4%; background: rgba(159,61,50,.16); }
          .hero__glow--two { left: 43%; bottom: -15%; background: rgba(82,119,108,.18); }
          .eyebrow, .panel__kicker { color: var(--rose); font-size: .65rem; font-weight: 700; letter-spacing: .22em; }
          .eyebrow { margin-bottom: 24px; }
          .hero__title-row { display: block; }
          h1 {
            max-width: 760px;
            margin-bottom: 22px;
            color: #202722;
            font-family: "Cormorant Garamond", "Noto Serif SC", serif;
            font-size: clamp(4rem, 7.2vw, 7.4rem);
            font-weight: 500;
            line-height: .82;
            letter-spacing: -.055em;
          }
          h1 em { color: var(--rose); font-family: "Ma Shan Zheng", "Noto Serif SC", cursive; font-size: .58em; font-style: normal; font-weight: 400; letter-spacing: .03em; vertical-align: .14em; }
          .hero__lede { max-width: 610px; color: #4f5d55; font-family: "Noto Serif SC", Georgia, serif; font-size: clamp(.95rem, 1.35vw, 1.12rem); letter-spacing: .015em; }
          .hero__status {
            width: fit-content;
            margin-top: 26px;
            padding: 8px 13px;
            color: var(--ink-soft);
            border-color: rgba(31,40,34,.15);
            border-radius: 2px;
            background: rgba(255,254,250,.64);
            backdrop-filter: blur(12px);
            font-size: .72rem;
            letter-spacing: .04em;
          }
          .pulse-dot { width: 6px; height: 6px; background: var(--rose); box-shadow: 0 0 0 5px rgba(159,61,50,.1); }
          .hero__actions { gap: 12px; margin-top: 36px; }
          .button {
            min-height: 47px;
            padding: 0 19px;
            border-radius: 2px;
            font-size: .69rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
          }
          .button--primary { color: #fff; background: var(--ink); }
          .button--primary:hover { background: var(--rose); }
          .button--secondary { color: var(--ink); background: rgba(255,254,250,.62); border-color: var(--line-strong); }
          .button--ghost { color: var(--ink); background: transparent; border-color: transparent; border-bottom-color: var(--line-strong); }

          .summary-grid { grid-template-columns: 1.25fr repeat(4, 1fr); gap: 1px; margin-top: -54px; background: var(--line); box-shadow: 0 20px 60px rgba(48,54,45,.08); }
          .summary-card {
            position: relative;
            min-height: 134px;
            padding: 23px 22px 20px;
            border: 0;
            border-radius: 0;
            background: rgba(255,254,250,.94);
            box-shadow: none;
            backdrop-filter: blur(18px);
          }
          .summary-card:first-child::before { content: ""; position: absolute; top: 0; right: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--rose), rgba(159,61,50,.08)); }
          .summary-card__label { color: #7a807b; font-size: .61rem; letter-spacing: .14em; }
          .summary-card strong { margin: 13px 0 6px; font-family: "Cormorant Garamond", serif; font-size: clamp(1.25rem, 2.1vw, 1.65rem); font-weight: 600; line-height: 1.08; }
          .summary-card small { font-size: .69rem; }

          .decision-strip { gap: 16px; margin: 38px 0 24px; }
          .decision-strip__item { padding: 15px 0; border: 0; border-block: 1px solid var(--line); border-radius: 0; background: transparent; }
          .decision-strip__item strong { font-family: "Noto Serif SC", Georgia, serif; font-size: .91rem; font-weight: 600; }
          .decision-strip__item div span { font-size: .71rem; }
          .status-badge { border-radius: 2px; font-size: .58rem; letter-spacing: .1em; }

          .planner-grid { gap: clamp(26px, 4vw, 58px); padding: 35px 0 110px; }
          .map-column { top: 26px; gap: 18px; }
          .panel {
            border-color: var(--line);
            border-radius: var(--radius-lg);
            background: rgba(255,254,250,.91);
            box-shadow: var(--shadow);
          }
          .panel__header { padding: 24px 25px 18px; }
          .panel__kicker { margin-bottom: 7px; }
          .panel h2, .itinerary-heading h2 { font-family: "Cormorant Garamond", "Noto Serif SC", serif; font-size: 2rem; font-weight: 600; letter-spacing: -.025em; }
          .map-column .panel {
            overflow: visible;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
          }
          .map-column .panel__header { padding: 10px 0 18px; }
          .map-column .map-wrap { margin-inline: 0; }
          .map-column .map-legend,
          .map-column .map-filters { padding-inline: 0; }
          .icon-button { width: 39px; height: 39px; border-radius: 2px; background: var(--paper-strong); }
          .icon-button:hover { border-color: var(--rose); }
          .map-wrap {
            margin: 0 13px;
            border: 1px solid rgba(29,29,31,.1);
            border-radius: 18px;
            background: #edf0f2;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.72), 0 8px 28px rgba(31,40,34,.06);
            filter: none;
          }
          #map {
            min-height: 470px;
            color: #1d1d1f;
            background: #edf0f2;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
          }
          #map .leaflet-tile-pane { background: #edf0f2; }
          #map .leaflet-tile {
            opacity: .93;
            filter: saturate(.58) brightness(1.1) contrast(.84) hue-rotate(338deg);
          }
          #map .leaflet-control-zoom {
            overflow: hidden;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 3px 14px rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.06);
          }
          #map .leaflet-bar a,
          #map .leaflet-bar a:hover {
            width: 36px;
            height: 36px;
            color: #1d1d1f;
            border-color: rgba(29,29,31,.09);
            background: rgba(255,255,255,.94);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 21px;
            font-weight: 400;
            line-height: 35px;
            backdrop-filter: blur(18px) saturate(180%);
          }
          #map .leaflet-bar a:hover { color: #007aff; background: #f5f5f7; }
          #map .leaflet-control-attribution {
            margin: 0 7px 7px 0;
            padding: 3px 7px;
            color: #6e6e73;
            border-radius: 7px;
            background: rgba(255,255,255,.82);
            box-shadow: 0 1px 5px rgba(0,0,0,.07);
            font-size: 9px;
            backdrop-filter: blur(14px) saturate(160%);
          }
          #map .leaflet-control-attribution a { color: #007aff; }
          #map .leaflet-tooltip {
            color: #1d1d1f;
            border: 0;
            border-radius: 9px;
            background: rgba(255,255,255,.94);
            box-shadow: 0 5px 18px rgba(0,0,0,.14);
            font-size: 11px;
            backdrop-filter: blur(18px) saturate(180%);
          }
          .map-loading {
            color: #1d1d1f;
            border: 1px solid rgba(29,29,31,.08);
            background: rgba(255,255,255,.9);
            box-shadow: 0 4px 18px rgba(0,0,0,.12);
            backdrop-filter: blur(18px) saturate(180%);
          }
          .map-legend, .map-filters { font-size: .68rem; }
          .map-filters input { accent-color: #007aff; }
          .legend-line--uber { border-color: #007aff; }
          .legend-line--walk { border-color: #34a853; }
          .legend-dot { background: #ff3b30; }

          .scenario-panel { padding: 14px 0 18px; }
          .scenario-panel .panel__header { padding-top: 0; }
          .segmented { gap: 18px; margin: 0; padding: 0; border-radius: 0; background: transparent; }
          .segmented button { position: relative; border-radius: 0; font-size: .68rem; letter-spacing: .05em; }
          .segmented button.is-active { color: var(--rose); background: transparent; box-shadow: none; }
          .segmented button.is-active::after { content: ""; position: absolute; right: 24%; bottom: 0; left: 24%; height: 2px; background: var(--rose); }
          .scenario-note { margin: 14px 0 18px; font-size: .68rem; }
          .map-column .health-card {
            position: relative;
            margin: 0;
            padding: 0 0 0 18px;
            color: var(--ink);
            border-radius: 0;
            background: transparent;
          }
          .map-column .health-card::before { content: ""; position: absolute; top: .52em; left: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 5px rgba(164,106,42,.09); }
          .map-column .health-card--good::before { background: var(--green); box-shadow: 0 0 0 5px rgba(79,113,93,.09); }
          .map-column .health-card--risk::before { background: var(--rose); box-shadow: 0 0 0 5px rgba(159,61,50,.09); }
          .watch-panel { padding: 22px 0 26px; }
          .watch-list { gap: 17px; }
          .watch-list div { padding-top: 0; border: 0; }
          .watch-list strong, .watch-list span { font-size: .71rem; }

          .itinerary-heading { position: relative; margin: 0 0 28px; padding: 20px 4px 20px; border-bottom: 1px solid var(--line); }
          .itinerary-heading::before { content: "行程"; position: absolute; top: -2px; right: 0; color: rgba(159,61,50,.08); font-family: "Ma Shan Zheng", cursive; font-size: 5rem; line-height: 1; }
          .timezone-chip { position: relative; z-index: 1; border-radius: 2px; background: rgba(255,254,250,.62); font-size: .65rem; letter-spacing: .04em; }
          .timeline { gap: 13px; }
          .timeline::before { left: 88px; width: 2px; background: linear-gradient(var(--rose), var(--teal) 55%, rgba(31,40,34,.1)); opacity: .62; }
          .timeline-item { scroll-margin-top: 26px; }
          .timeline-item.is-completing {
            overflow: hidden;
            max-height: var(--done-height, 500px);
            transform-origin: center right;
            animation: done-fade-away .62s cubic-bezier(.4, 0, .2, 1) both;
            will-change: opacity, transform, max-height;
          }
          .timeline-item.is-complete { display: none; }
          @keyframes done-fade-away {
            0% { max-height: var(--done-height, 500px); opacity: 1; transform: translateX(0) scale(1); }
            58% { max-height: var(--done-height, 500px); opacity: 0; transform: translateX(28px) scale(.985); }
            100% { max-height: 0; opacity: 0; transform: translateX(28px) scale(.985); }
          }
          .timeline-item__time strong { font-family: "Cormorant Garamond", serif; font-size: 1rem; font-weight: 600; }
          .timeline-item__time span { font-size: .62rem; letter-spacing: .04em; }
          .timeline-dot { border-width: 4px; border-color: var(--paper); background: var(--rose); box-shadow: 0 0 0 1px rgba(159,61,50,.28); }
          .timeline-card {
            padding: 20px 21px;
            border-color: var(--line);
            border-radius: 4px;
            background: rgba(255,254,250,.88);
            box-shadow: 0 9px 28px rgba(48,54,45,.035);
          }
          .timeline-card::before { content: ""; position: absolute; top: 13px; bottom: 13px; left: -1px; width: 2px; background: linear-gradient(transparent, rgba(159,61,50,.42), transparent); opacity: 0; transition: opacity .2s ease; }
          .timeline-card:hover { transform: translateY(-2px); border-color: rgba(31,40,34,.23); box-shadow: 0 16px 38px rgba(48,54,45,.07); }
          .timeline-card:hover::before { opacity: 1; }
          .timeline-card__label { color: var(--rose); font-size: .61rem; letter-spacing: .12em; }
          .timeline-card h3 { margin: 7px 0 5px; font-family: "Noto Serif SC", Georgia, serif; font-size: 1rem; font-weight: 600; }
          .timeline-card__meta, .timeline-card__note { color: #727871; font-size: .72rem; }
          .duration-pill, .reservation-chip { border-radius: 2px; }
          .duration-pill { background: #efeee8; font-size: .63rem; }
          .timeline-card__details { gap: 6px; }
          .metric { padding: 10px; border-radius: 2px; background: rgba(239,238,232,.78); }
          .metric span { font-size: .56rem; letter-spacing: .08em; }
          .metric strong { font-size: .72rem; }
          .small-button { min-height: 35px; border-radius: 2px; background: var(--paper-strong); font-size: .63rem; letter-spacing: .035em; }
          .small-button--accent { color: var(--rose); background: var(--rose-soft); }
          .small-button--apple { color: #007aff; border-color: rgba(0,122,255,.18); }
          .small-button--google { color: #3367d6; border-color: rgba(66,133,244,.2); }
          .small-button--apple:hover { border-color: #007aff; }
          .small-button--google:hover { border-color: #4285f4; }
          .gap-card { background: linear-gradient(120deg, rgba(248,240,223,.7), rgba(255,254,250,.94)); }
          .route-steps { border-radius: 3px; background: rgba(255,255,255,.4); }
          .route-steps summary { color: var(--rose); font-size: .67rem; }

          .map-marker {
            border-width: 3px;
            border-radius: 50% 50% 50% 5px;
            background: #ff3b30;
            box-shadow: 0 5px 16px rgba(0,0,0,.24), 0 0 0 1px rgba(0,0,0,.04);
          }
          .leaflet-popup-content-wrapper {
            color: #1d1d1f;
            border: 1px solid rgba(29,29,31,.07);
            border-radius: 14px;
            background: rgba(255,255,255,.96);
            box-shadow: 0 12px 40px rgba(0,0,0,.17);
            backdrop-filter: blur(22px) saturate(180%);
          }
          .leaflet-popup-tip { background: rgba(255,255,255,.96); }
          .leaflet-popup-content { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
          .popup-title { font-family: "Noto Serif SC", Georgia, serif; }
          .popup-link { color: #007aff; }

          .footer { position: relative; border-color: var(--line); background: rgba(255,254,250,.54); }
          .footer::before { content: "旅"; position: absolute; top: -32px; left: 50%; display: grid; place-items: center; width: 62px; height: 62px; color: var(--rose); border: 2px solid var(--rose); background: var(--paper); font-family: "Ma Shan Zheng", cursive; font-size: 2rem; transform: translateX(-50%) rotate(-2deg); }
          .footer__inner { padding: 56px 0 42px; }
          .footer p { font-size: .68rem; }
          .footer a { color: var(--rose); }
          .toast { border-radius: 3px; background: var(--ink); }

          .summary-card, .decision-strip, .panel, .timeline-item { animation: ink-rise .65s both; animation-timeline: view(); animation-range: entry 5% cover 24%; }
          @keyframes ink-rise { from { opacity: 0; transform: translateY(18px); filter: blur(2px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }

          @media (max-width: 1080px) {
            .summary-grid { grid-template-columns: repeat(3, 1fr); }
            .planner-grid { gap: 28px; }
            .map-column { position: static; }
          }
          @media (max-width: 720px) {
            .shell { width: min(calc(100% - 28px), var(--shell)); }
            .ink-nav { top: 16px; }
            .ink-brand__seal { width: 38px; height: 38px; }
            .ink-nav__links { gap: 16px; }
            .ink-nav__links a:first-child { display: none; }
            .hero { min-height: 810px; background-position: 64% bottom; }
            .hero::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(251,250,246,.28), transparent 38%, rgba(251,250,246,.56) 76%, var(--paper)); pointer-events: none; }
            .hero__inner { justify-content: flex-start; min-height: 810px; padding: 160px 0 100px; }
            h1 { max-width: 470px; font-size: clamp(3.75rem, 17vw, 5.6rem); }
            .hero__lede { max-width: 90%; }
            .hero__status { margin-top: 22px; }
            .hero__actions { display: flex; }
            .summary-grid { grid-template-columns: 1fr 1fr; margin-top: -48px; }
            .summary-card:first-child { grid-column: 1 / -1; }
            .planner-grid { padding-bottom: 90px; }
