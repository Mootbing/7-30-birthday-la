<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA Day Plan — Loading</title><style>html,body{height:100%;margin:0;background:#f6f4ee;color:#17233a;font:16px system-ui}body{display:grid;place-items:center}main{text-align:center}.s{width:34px;height:34px;border:3px solid #d4d4d4;border-top-color:#18776d;border-radius:50%;margin:0 auto 14px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><main><div class="s"></div><strong>Opening the OSM trip planner…</strong></main><script>(async()=>{const names=['p0.txt','p1.txt','p2.txt','p3.txt','p4.txt','p5.txt','p6.txt','p7.txt'];const b64=(await Promise.all(names.map(n=>fetch(n).then(r=>{if(!r.ok)throw Error(n);return r.text()})))).join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()})().catch(e=>document.body.innerHTML='<main><strong>Could not load itinerary.</strong><br>'+e+'</main>')</script></body></html>
