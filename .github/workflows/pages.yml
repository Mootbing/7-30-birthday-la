name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html ink-wash-la.png ink-wash-parallax-bg.png ink-wash-parallax-mid.png ink-wash-parallax-front.png p0.txt p1.txt p2.txt p3.txt p4.txt p5.txt p6.txt p7.txt .nojekyll _site/

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.upload.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Verify live Pages response
        id: verify
        if: steps.deployment.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set +e
          code="000"
          bg_asset_code="000"
          mid_asset_code="000"
          front_asset_code="000"
          content_check="false"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o page-response.html -w '%{http_code}' "$PAGE_URL")"
            bg_asset_code="$(curl -L -sS -o /dev/null -w '%{http_code}' "${PAGE_URL%/}/ink-wash-parallax-bg.png")"
            mid_asset_code="$(curl -L -sS -o /dev/null -w '%{http_code}' "${PAGE_URL%/}/ink-wash-parallax-mid.png")"
            front_asset_code="$(curl -L -sS -o /dev/null -w '%{http_code}' "${PAGE_URL%/}/ink-wash-parallax-front.png")"
            if [ "$code" = "200" ] && [ "$bg_asset_code" = "200" ] && [ "$mid_asset_code" = "200" ] && [ "$front_asset_code" = "200" ] && grep -q 'LA Birthday Journey' page-response.html; then
              content_check="true"
              break
            fi
            sleep 10
          done
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          echo "asset_http_code=$bg_asset_code/$mid_asset_code/$front_asset_code" >> "$GITHUB_OUTPUT"
          echo "content_check=$content_check" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ] || [ "$bg_asset_code" != "200" ] || [ "$mid_asset_code" != "200" ] || [ "$front_asset_code" != "200" ] || [ "$content_check" != "true" ]; then
            exit 1
          fi

      - name: Record deployment receipt
        if: always()
        run: |
          cat > pages-status.json <<EOF
          {
            "configure_outcome": "${{ steps.configure.outcome }}",
            "upload_outcome": "${{ steps.upload.outcome }}",
            "deploy_outcome": "${{ steps.deployment.outcome }}",
            "verify_outcome": "${{ steps.verify.outcome }}",
            "page_url": "${{ steps.deployment.outputs.page_url }}",
            "page_http_code": "${{ steps.verify.outputs.http_code }}",
            "content_check": "${{ steps.verify.outputs.content_check }}",
            "source_commit": "${GITHUB_SHA}",
            "workflow_run": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-status.json
          git commit -m 'Record Pages deployment receipt [skip ci]' || true
          git push || true
