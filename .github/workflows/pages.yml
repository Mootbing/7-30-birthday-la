name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Attempt to enable Pages for this repository
        id: enable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          response_file="$(mktemp)"
          http_code="$(curl -sS -L -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')"
          cp "$response_file" pages-enable-response.json
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"
          if [ "$http_code" != "201" ] && [ "$http_code" != "409" ]; then
            echo "::warning::Pages enablement returned HTTP $http_code. The repository owner may need to choose GitHub Actions under Settings → Pages."
          fi
          exit 0

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html p0.txt p1.txt p2.txt p3.txt p4.txt p5.txt p6.txt p7.txt .nojekyll _site/

      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Record deployment diagnostics
        if: always()
        run: |
          cat > pages-status.json <<EOF
          {
            "enable_http_code": "${{ steps.enable.outputs.http_code }}",
            "configure_outcome": "${{ steps.configure.outcome }}",
            "upload_outcome": "${{ steps.upload.outcome }}",
            "deploy_outcome": "${{ steps.deployment.outcome }}",
            "page_url": "${{ steps.deployment.outputs.page_url }}",
            "workflow_run": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-status.json pages-enable-response.json
          git commit -m 'Record Pages deployment status [skip ci]' || true
          git push || true
